<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleb PC | Developer & Creator</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background: linear-gradient(-45deg, #000000, var(--secondary), var(--bg));
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Container */
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        /* Header / Hero */
        header {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .typing-effect::after {
            content: '|';
            animation: blink 1s infinite;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; }
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--bg);
        }
        .btn-outline {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.5);
        }

        /* Grid Section */
        .section-title { font-size: 2rem; margin: 4rem 0 2rem; border-left: 4px solid var(--secondary); padding-left: 1rem; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 16px;
            transition: transform 0.3s, border-color 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .card h3 { margin-bottom: 0.5rem; color: var(--primary); }
        .card p { color: var(--text-muted); font-size: 0.95rem; }

        /* Footer */
        footer {
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes blink { 50% { opacity: 0; } }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
        }

        .link-group { display: flex; gap: 1rem; flex-wrap: wrap; }
        .link {
            padding: 0.8rem 1.5rem;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }
        .link-outline {
            border-color: var(--primary);
            color: var(--primary);
        }
        .link:hover {
            transform: translateY(5px);
            box-shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hero Section -->
        <header>
            <p style="color: var(--secondary); font-weight: 600; margin-bottom: 0.5rem;">Hello, I'm</p>
            <h1>Kaleb</h1>
            <p class="subtitle">I build <span class="typing-effect" id="typewriter"></span></p>
            
            <div class="btn-group">
                <a href="https://github.com/kalebpc/kalebpc.github.io" class="btn btn-primary">View GitHub</a>
                <a href="" class="btn btn-outline">Click Here</a>
            </div>
        </header>

        <!-- Projects Section -->
        <h2 class="section-title">Featured Projects</h2>
        <div class="grid">
            <!-- Project 1 -->
            <div class="card">
                <div class="link-group">
                    <a href="https://github.com/kalebpc/windows" class="link link-outline">Windows things</a>
                    <a href="https://github.com/kalebpc/handbrakecli" class="link link-outline">HandbrakeCLI</a>
                    <a href="https://github.com/kalebpc/jellyfin" class="link link-outline">Jellyfin</a>
                    <a href="https://github.com/kalebpc/ImageEdit" class="link link-outline">Edit Images</a>
                    <a href="https://github.com/kalebpc/home-media-server-build" class="link link-outline">Home Lab</a>
                </div>
            </div>
        </div>

        <!-- Skills/About Section -->
        <h2 class="section-title">Tech Stack</h2>
        <div class="grid">
            <div class="card">
                <h3>Software Tools</h3>
                <p>Docker, Linux, Bash, Powershell, C#, Python, Batch, Golang, Git, etc</p>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Kaleb PC. Built on GitHub Pages.</p>
        </footer>
    </div>

    <script>
        // Typing Animation Logic
        const texts = ["applications.", "solutions.", "the future."];
        let count = 0;
        let index = 0;
        let currentText = "";
        let letter = "";
        
        (function type() {
            if (count === texts.length) { count = 0; }
            currentText = texts[count];
            letter = currentText.slice(0, ++index);
            
            document.getElementById('typewriter').textContent = letter;
            
            if (letter.length === currentText.length) {
                setTimeout(() => {
                    // Pause at end of word before deleting (optional logic added here if needed)
                    // For now, it just types forward then resets loop for simplicity
                    count++;
                    index = 0;
                }, 2000); 
            }
            
            let typeSpeed = 100;
            if (letter.length === currentText.length) typeSpeed = 2000; // Pause at end
            
            setTimeout(type, typeSpeed);
        }());
    </script>
    <!--Jokes on you, bots. Ai wrote 99% of this html lol.-->
</body>
</html>
